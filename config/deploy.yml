# Oracle Always Free deploy.
# After the VM exists, replace PASTE_ORACLE_IP with the public IPv4, e.g. 140.238.10.20
# For proxy.host and APP_HOST, change dots to hyphens: 140-238-10-20.sslip.io
#
# Dummy db/seeds.rb is never run in production.
service: shree_banke_bihari_honda

image: rishubhlodhi121/shree_banke_bihari_honda

servers:
  web:
    - PASTE_ORACLE_IP

proxy:
  ssl: true
  host: PASTE-HYPHEN-IP.sslip.io

registry:
  username: rishubhlodhi121
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  secret:
    - RAILS_MASTER_KEY
  clear:
    APP_HOST: PASTE-HYPHEN-IP.sslip.io
    SOLID_QUEUE_IN_PUMA: true

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole"

volumes:
  - "shree_banke_bihari_honda_storage:/rails/storage"

asset_path: /rails/public/assets

# Always Free Ampere is ARM. Build on the Oracle VM, not on your laptop.
builder:
  arch: arm64
  remote: ssh://ubuntu@PASTE_ORACLE_IP

ssh:
  user: ubuntu
